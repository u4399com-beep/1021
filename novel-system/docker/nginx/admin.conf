# ============================================================
# nginx — reverse proxy: admin (Vue) + themes (multi-site) + api
# ============================================================
upstream novel_api {
    server backend:8000;
}

# Map: domain → theme template root (managed via Site records in DB)
# In production these are populated by Sites app or by reading site.host
map $host $site_theme_root {
    default /usr/share/nginx/themes/default;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- Vue admin SPA (route everything under /admin to it) ---
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://novel_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django admin & static ---
    # v103: Restrict Django admin to internal IPs only
    location /django-admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all; {
        proxy_pass http://novel_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://novel_api;
    }

    location /media/ {
        proxy_pass http://novel_api;
    }

    # --- Multi-site front themes ---
    # Per-site nginx config is generated dynamically by Sites app.
    # See docker/nginx/sites/ — included here.
    include /etc/nginx/sites-enabled/*.conf;

    # --- Default front (theme: simple_reading) ---
    location / {
        root /usr/share/nginx/themes/simple_reading;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
