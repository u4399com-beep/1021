# ============================================================
# docker-compose — single-host full stack
#   - postgres  : database
#   - redis     : broker + cache
#   - backend   : Django + gunicorn (api + admin)
#   - worker    : Celery worker for crawler queue
#   - beat      : Celery beat for scheduled tasks
#   - flower    : Celery monitoring UI
#   - frontend  : Vue admin (nginx)
#   - themes    : Multi-site front themes (nginx)
#   - nginx     : Edge reverse proxy (port 80)
# ============================================================
version: "3.9"

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-novel}
  DB_USER: ${DB_USER:-novel}
  DB_PASSWORD: ${DB_PASSWORD:-novel_pwd_2024}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  # Tier-1: Firecrawl
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
  FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev/v1}
  # Tier-2: Browser Use
  BROWSER_USE_OPENAI_API_KEY: ${BROWSER_USE_OPENAI_API_KEY:-}
  BROWSER_USE_MODEL: ${BROWSER_USE_MODEL:-gpt-4o-mini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Tier-3: Playwright + Hyperbrowser
  HYPERBROWSER_API_KEY: ${HYPERBROWSER_API_KEY:-}
  PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
  PLAYWRIGHT_PROXY: ${PLAYWRIGHT_PROXY:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-novel}
      POSTGRES_USER: ${DB_USER:-novel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novel_pwd_2024}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: novel-redis
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: novel-backend
    environment: *backend-env
    volumes:
      - ../backend/media:/app/media
      - ../backend/static:/app/static
      - ../backend/logs:/app/logs
      - ../themes:/usr/share/nginx/themes-host:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py init_default_data &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --worker-class uvicorn.workers.UvicornWorker
               --timeout 120
               --access-logfile -
               --error-logfile -"
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: novel-worker
    environment: *backend-env
    volumes:
      - ../backend/media:/app/media
      - ../backend/logs:/app/logs
      - ../themes:/usr/share/nginx/themes-host:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=4
        -Q crawler,download,celery
        --max-tasks-per-child=100
    restart: unless-stopped

  beat:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: novel-beat
    environment: *backend-env
    volumes:
      - ../backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  flower:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: novel-flower
    environment: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config flower --port=5555 --url-prefix=flower
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: novel-frontend
    volumes:
      - ../themes:/usr/share/nginx/themes-host:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: novel-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ../themes:/usr/share/nginx/themes:ro
      - ../backend/staticfiles:/usr/share/nginx/static:ro
      - ../backend/media:/usr/share/nginx/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
